name: Build Debug APK (test icin)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Debug APK derle (imzasiz, sadece test icin)
        id: build
        run: gradle :app:assembleDebug --no-daemon > /tmp/build.log 2>&1
        continue-on-error: true

      - name: Sonucu yayinla (basariliysa APK, degilse hata logu)
        if: always()
        run: |
          mkdir -p /tmp/apk-out
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk-out/AIChatBot-debug.apk
          fi
          cp /tmp/build.log /tmp/apk-out/build-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apk-out/* .
          git add -A
          git commit -m "Build run ${{ github.run_number }} (${{ steps.build.outcome }})"
          git push origin apk-builds --force

      - name: Derleme basarisizsa isi kirmizi yap
        if: steps.build.outcome == 'failure'
        run: exit 1
