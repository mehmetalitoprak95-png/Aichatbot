name: Build Debug APK (test icin)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Debug APK derle (imzasiz, sadece test icin)
        run: gradle :app:assembleDebug --no-daemon

      - name: APK'yi indirilebilir branch'e yayinla
        run: |
          mkdir -p /tmp/apk-out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk-out/AIChatBot-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-builds
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/apk-out/AIChatBot-debug.apk .
          git add AIChatBot-debug.apk
          git commit -m "Debug APK build run ${{ github.run_number }}"
          git push origin apk-builds --force
